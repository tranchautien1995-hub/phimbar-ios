name: Build iOS 15 IPA
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Convert website CSS for iOS 15
        run: |
          npm ci --ignore-scripts
          node scripts/prepare-css.mjs
      - name: Build arm64 IPA
        run: bash scripts/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Phimbar-iOS15-TrollStore
          path: |
            build/Phimbar-iOS15-TrollStore.ipa
            build/SHA256.txt
            build/macho-info.txt
          if-no-files-found: error
