name: Build XemPhim iOS IPA
on:
  push:
    branches: [codex/xemphim-episode-rental]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Protocol, subtitle and URL checks
        run: |
          node --test Tests/rental.test.cjs
          mkdir -p build
          xcrun swiftc Sources/Core.swift Sources/HLSRouting.swift Tests/main.swift -o build/protocol-tests
          build/protocol-tests | tee build/test-results.txt
      - name: Build iOS 15 arm64 IPA
        run: bash scripts/build.sh
      - name: Simulator compile and launch
        run: bash scripts/simulator.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: XemPhim-iOS15-TrollStore
          path: |
            build/XemPhim-iOS15-TrollStore.ipa
            build/SHA256.txt
            build/macho-info.txt
            build/test-results.txt
            build/player-verification.json
            build/web-player-verification.json
            build/keychain-verification.json
            build/entitlements.plist
            build/simulator-entitlements.plist
            build/simulator-build.log
            build/simulator-*.png
            build/simulator-launch.txt
          if-no-files-found: error
